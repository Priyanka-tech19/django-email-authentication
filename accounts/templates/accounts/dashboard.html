{% extends 'accounts/layout.html' %}
{% block content %}
<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class ="card shadow p-4 rounded-4 w-100" style ="max-width:450px;">
        <h2 class ="text-center mb-3 text-primary"> My Account </h2>
        <hr>

       
        <!--Profile Image-->
        <div class="text-center mb-4">
           {% if profile.profile_pic %}
                <img src="{{ profile.profile_pic.url}}"
                    class ="rounded-circle shadow"
                    width="130" height="130"
                    style="object-fit: cover;">
            {% else %}  
                <img src ="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                class="rounded-circle shadow"
                width="130">
            {% endif %}

            <h5 class="mt-3">Hello, {{ request.user.username }} 👋</h5>
        </div>

        <div class="d-grid gap-2 mt-4">
            <a href="{% url 'update_profile' %}" class="btn btn-primary">
                Update Profile Picture
            </a>
        <!--Logout-->
        
            <a href="{url 'logout' %}" class="btn-btn-outline-danger w-100">
            Logout
            </a>
        </div>

    </div>
</div>
{% endblock %}
